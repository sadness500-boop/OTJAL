/* OTJAL v0.3 — bright, refined: pure white + blush mist, rose accent used sparingly, champagne hairlines.
   Layout: slim utility bar → brand bar → tab strip; each tab is a working screen with a live 3D figure stage. */
:root{
  --bg:#FFFFFF; --bg2:#FBF6F4; --surface:#FFFFFF; --ink:#27262B; --ink2:#4A4850; --muted:#8C8892; --line:#EFE7E4; --chip:#F8F2F0;
  --accF:#E0577D; --accM:#4467D8; --acc:var(--accF); --accSoft:#FCEBF0; --accSoftM:#ECF0FC; --soft:var(--accSoft);
  --gold:#C9A27C; --onAcc:#FFFFFF;
  --mq:#EADDD3; --mqLine:#D6C4B7; --hair:#4A3528;
  --good:#2E8A62; --warn:#B98318; --bad:#D04545;
  --stage1:#FFFFFF; --stage2:#F6ECE8;
  --sh:0 1px 2px rgba(39,38,43,.04),0 12px 32px rgba(39,38,43,.06);
  --f-display:"Cormorant Garamond","Noto Serif KR",Georgia,serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141317; --bg2:#19181D; --surface:#1D1C21; --ink:#F2EEF0; --ink2:#D5D0D6; --muted:#A29DA6; --line:#2E2C33; --chip:#25232A;
  --accF:#F27A9B; --accM:#829DFF; --accSoft:#3A2530; --accSoftM:#232B45; --gold:#D9B894;
  --mq:#5C4E47; --mqLine:#77655C; --hair:#120E0D; --good:#61C894; --warn:#E3B04B; --bad:#FF7272;
  --stage1:#24222A; --stage2:#1A191E; --sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141317; --bg2:#19181D; --surface:#1D1C21; --ink:#F2EEF0; --ink2:#D5D0D6; --muted:#A29DA6; --line:#2E2C33; --chip:#25232A;
  --accF:#F27A9B; --accM:#829DFF; --accSoft:#3A2530; --accSoftM:#232B45; --gold:#D9B894;
  --mq:#5C4E47; --mqLine:#77655C; --hair:#120E0D; --good:#61C894; --warn:#E3B04B; --bad:#FF7272;
  --stage1:#24222A; --stage2:#1A191E; --sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.3); color-scheme:dark }
:root[data-g="M"]{ --acc:var(--accM); --soft:var(--accSoftM); --lgF:0; --lgM:1 }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;font-weight:400;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.util{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-block:6px 0;font-size:14px}
.ubtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);padding:5px 10px;border-radius:999px;font-weight:500}
.ubtn:hover{background:var(--chip);color:var(--ink)}
.ubtn svg{width:15px;height:15px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:2px;margin-left:4px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{display:flex;align-items:center;gap:16px;padding-block:6px 4px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);border:0;background:none;padding:0}
.brand svg{width:36px;height:36px;flex:none}
.wm{display:flex;align-items:baseline;gap:8px;line-height:1}
.wm b{font-family:var(--f-display);font-weight:700;font-size:29.5px;letter-spacing:.16em}
.ver{font-size:11.5px;font-weight:500;color:var(--acc);background:var(--soft);border-radius:999px;padding:2px 7px;letter-spacing:.02em;align-self:center}
.spacer{flex:1}
.gsw{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.gsw button{white-space:nowrap;border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:500;font-size:14.5px;color:var(--muted)}
.gsw button[aria-pressed="true"]{background:var(--surface);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:700}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 14px 11px;font-weight:500;font-size:16px;color:var(--muted);white-space:nowrap;position:relative}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:var(--acc)}
nav.tabs .cnt{font-size:11.5px;background:var(--acc);color:var(--onAcc);border-radius:99px;padding:0 6px;margin-left:5px;font-weight:700}

main{padding-block:28px 64px}
section.tab{display:flex;flex-direction:column;gap:30px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.035em;font-weight:700}
h2{font-size:clamp(26px,3.2vw,33px)}
h3{font-size:20px}
.eyebrow{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:17.5px;letter-spacing:.04em;color:var(--acc)}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.note{font-size:14px;color:var(--muted);line-height:1.65}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:6px 0 0;max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:500;font-size:15.5px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onAcc);font-weight:700}
.btn.pri:hover{filter:brightness(1.06);color:var(--onAcc)}
.btn.big{padding:15px 28px;font-size:17.5px}
.btn.sm{padding:6px 12px;font-size:14px}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:500;color:var(--ink2)}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;background:var(--chip);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.tag.ok{color:var(--good)} .tag.loose{color:var(--warn)} .tag.bad{color:var(--bad)}
.sticker{display:inline-flex;align-items:center;font-family:var(--f-display);font-style:italic;font-weight:700;font-size:16.5px;letter-spacing:.03em;background:var(--surface);color:var(--acc);border:1px solid var(--line);padding:2px 12px;border-radius:999px;box-shadow:var(--sh)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--sh)}

/* 3D figure */
.fig{position:relative;width:100%;background:radial-gradient(120% 80% at 50% 25%,var(--stage1),var(--stage2));border-radius:18px;overflow:hidden;display:grid;place-items:center}
.fig canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y}
.fig img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;padding:10px 6px 0}
.fig .av{width:auto;height:92%;max-width:100%}
.fig .fctl{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.fig .fctl button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;font-size:12.5px;padding:4px 10px}
.fig .fctl button[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}
.fig .fbadge{position:absolute;right:12px;top:12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 9px;border-radius:999px}
.fig .fload{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fig.live{aspect-ratio:3/4.1;max-height:640px}
.fig.card{aspect-ratio:3/4.2;border-radius:0}
.fig.snap{aspect-ratio:3/4.3}
.fig.look{aspect-ratio:3/4.4;border-radius:14px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:stretch;background:linear-gradient(135deg,var(--bg2),var(--surface) 70%);border:1px solid var(--line);border-radius:28px;padding:28px}
.hero-l{display:flex;flex-direction:column;gap:20px;justify-content:center;padding:12px 8px}
.hero h1{font-size:clamp(31px,4.1vw,50px);font-weight:700;line-height:1.12;letter-spacing:-.045em}
.hero h1 em{font-style:normal;color:var(--acc);font-family:var(--f-display);font-weight:700;letter-spacing:.02em}
.hero p.lead{font-size:17.5px;color:var(--ink2);margin:0;max-width:44ch;font-weight:400}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:center}
.stage>.sticker{position:absolute;top:12px;left:12px;z-index:2}
.lookList{display:flex;flex-direction:column;gap:9px;min-width:0}
.lookItem{display:flex;gap:10px;align-items:center;font-size:14.5px;min-width:0}
.lookItem .th{width:44px;height:44px;flex:none;background:var(--chip);border-radius:12px;display:grid;place-items:center}
.lookItem .th svg{width:34px;height:34px}
.lookItem b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{font-size:15px;border-top:1px solid var(--line);padding-top:9px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.total b{font-weight:700}
.pain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pain div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.pain b{font-size:17.5px;display:block;margin-bottom:4px;font-weight:700}
.pain i{font-family:var(--f-display);font-style:italic;color:var(--gold);font-size:23px;display:block;line-height:1}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card .img{position:relative;background:var(--chip);border:0;padding:0;width:100%;cursor:pointer;color:inherit;display:grid;grid-template-columns:.8fr 1.2fr;align-items:end}
.card .img .g{display:grid;place-items:center;height:100%}
.card .img .g svg{width:80%;height:auto}
.card .img .a{height:100%}
.card .img .a .fig{height:100%;background:transparent}
.card .score{position:absolute;top:10px;right:10px;background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.06);z-index:2}
.card .score b{color:var(--acc)}
.card .ex{position:absolute;bottom:8px;left:12px;font-size:11.5px;color:var(--muted);z-index:2}
.card .rank{position:absolute;top:10px;left:10px;z-index:2;font-size:14.5px;padding:1px 10px}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .nm{font-weight:700;font-size:17px;line-height:1.35;letter-spacing:-.03em}
.card .pr{font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.card .why{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted)}
.card .why span::before{content:"· ";color:var(--acc);font-weight:700}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;font-size:12.5px;align-items:center;margin-top:6px}
.bars i{display:block;height:5px;border-radius:9px;background:var(--chip);overflow:hidden}
.bars i b{display:block;height:100%;background:var(--acc)}
.bars em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-size:14px;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.input{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;width:100%}
.sites{display:flex;flex-wrap:wrap;gap:6px}
.site{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:500;color:var(--ink);text-decoration:none;background:var(--surface)}
.site:hover{border-color:var(--acc);color:var(--acc)}
.site i{width:7px;height:7px;border-radius:50%;display:inline-block}
.sg{display:flex;flex-direction:column;gap:6px}
.sg>span{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}

/* coordi */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.look{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;box-shadow:var(--sh)}
.look h3{font-size:17.5px}

/* fitting */
.fit{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:22px;align-items:start}
.fitStage{position:sticky;top:132px;display:flex;flex-direction:column;gap:12px}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.slot .th{width:58px;height:58px;background:var(--chip);border-radius:14px;display:grid;place-items:center}
.slot .th svg{width:46px;height:46px}
.slot .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;max-width:100%;min-width:0}
.sizes{display:flex;gap:4px;flex-wrap:wrap}
.sizes button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sizes button.rec{box-shadow:inset 0 -2px 0 var(--acc)}
.av{width:100%;height:auto;display:block}

/* profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.fs{display:flex;flex-direction:column;gap:14px}
.fs h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fs h3 small{font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0}
.sub{font-size:14.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 11px;color:var(--ink);font-size:15.5px;width:100%;font-variant-numeric:tabular-nums}
.rng{display:grid;grid-template-columns:92px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14.5px}
.rng input{width:100%;accent-color:var(--acc)}
.rng output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--surface) inset}
.sw[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6)}
.sw.no[aria-pressed="true"]::after{content:"✕"}
.swl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);width:54px;text-align:center}
.side{position:sticky;top:132px;display:flex;flex-direction:column;gap:12px}
.closet{display:flex;flex-wrap:wrap;gap:6px}
.closet .tag button{border:0;background:none;padding:0 0 0 4px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.measure{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.mbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mbox label{font-size:14px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.mbox label b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.mbox input[type=range]{width:100%;accent-color:var(--acc)}

/* wish */
.wl{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.wrow .th{width:56px;height:56px;background:var(--chip);border-radius:12px;display:grid;place-items:center}
.wrow .th svg{width:44px;height:44px}

/* brand */
.bgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.logoBig{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logoBig svg{width:110px;height:110px}
.logoBig .wm b{font-size:75.5px}
.icons{display:flex;gap:16px;flex-wrap:wrap}
.icons div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.icons svg{width:80px;height:80px}
.slogan{font-size:clamp(28px,3.8vw,42px);font-weight:700;line-height:1.25;letter-spacing:-.04em}
.slist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.slist li{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.slist li span{font-size:12.5px;color:var(--muted);min-width:70px}
.slist li b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pal div{border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}
.pal i{display:block;height:56px}
.pal p{margin:0;padding:8px 10px}

footer{border-top:1px solid var(--line);padding-block:24px 30px;background:var(--bg2)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
footer .sig{font-family:var(--f-display);font-weight:700;font-size:16.5px;letter-spacing:.04em;color:var(--ink)}

dialog{border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:88vh;box-shadow:0 30px 80px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(30,26,32,.35);backdrop-filter:blur(3px)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg .kw{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrbox{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:center}
.qrbox .qr{background:#fff;border-radius:16px;padding:10px;border:1px solid var(--line)}
.qrbox .qr svg,.qrbox .qr img{width:100%;height:auto;display:block}
.copybox{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:15px;white-space:pre-wrap;user-select:all;background:var(--bg2)}

/* v0.2 carry-over */
.catsec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:140px}
.catsec h3{font-size:22px}
.recLay{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.wi{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:14px;min-width:0}
.lnk{border:0;background:none;padding:0;text-align:left;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lnk:hover{color:var(--acc)}
dialog.wide{width:min(1020px,calc(100vw - 32px))}
.det{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start}
.detL{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.pair{display:grid;grid-template-columns:.8fr 1.2fr;gap:8px}
.gbox{background:var(--chip);border-radius:18px;display:grid;place-items:center;padding:10px}
.gbox svg{width:85%}
.angles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.angles .fig{aspect-ratio:3/4.2;border-radius:12px}
.pbig{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.spec{display:grid;grid-template-columns:76px minmax(0,1fr);gap:7px 12px;margin:0;font-size:15px}
.spec dt{color:var(--muted);font-weight:500}
.spec dd{margin:0}
.tw{overflow-x:auto}
.mt{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;width:100%;min-width:360px}
.mt th,.mt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center}
.mt th{font-weight:500;color:var(--ink2)}
.mt td:first-child{text-align:left;color:var(--muted)}
.mt .on{background:var(--soft);color:var(--acc);font-weight:700}
.mt .me{color:var(--muted);border-left:1px dashed var(--line)}
.chip small{font-size:11.5px;opacity:.7}
.quick{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.qitems{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.qi{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:14px;width:62px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px}
.qi svg{width:40px;height:40px}
.qi span{font-size:11.5px;color:var(--muted)}
.qi[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:var(--soft)}

@media (max-width:880px){
  .recLay,.det,.hero,.fit,.prof,.bgrid{grid-template-columns:minmax(0,1fr)}
  .recLay .side,.prof .side{order:-1}
  .fig.live{max-height:430px}
  .detL,.fitStage,.side{position:static}
  .pain{grid-template-columns:1fr}
  .hero{padding:18px}
  .qrbox{grid-template-columns:1fr}
  .qrbox .qr{max-width:220px}
}
@media (max-width:520px){
  .look{grid-template-columns:110px minmax(0,1fr)}
  .ubtn span{display:none}
  .gsw button{padding:6px 10px}
  .util .seg button{padding:3px 8px}
  .wm b{font-size:25px}
  .stage{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .5s cubic-bezier(.2,1,.3,1)}
  @keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
}

/* v0.4 */
.script{font-family:'OTJAL Script','Great Vibes','Snell Roundhand','Apple Chancery',cursive;font-weight:400;letter-spacing:0}
footer .sig{display:inline-flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:15px;color:var(--muted)}
footer .sig .script{font-size:34px;color:var(--ink);font-style:normal;line-height:1}
.mpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mp{flex:none;border:1px solid var(--line);border-radius:16px;background:var(--bg2);width:82px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink2)}
.mp img{height:118px;width:auto;max-width:100%;object-fit:contain}
.mp b{font-size:13px;font-weight:700}
.mp small{font-size:11.5px;color:var(--muted)}
.mp .auto{height:118px;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:700;font-size:20px;color:var(--acc)}

function garment(it, i){

    wa:[[-1,"조임","bad"],[3.5,"정핏","ok"],[7,"여유","loose"],[1e9,"큼","bad"]],

    th:[[0,"타이트","bad"],[4,"슬림","ok"],[12,"정핏","ok"],[1e9,"여유","loose"]],

function regions(it, i, p){

const PARTNAME = {style:"취향·스타일",closet:"보유 옷 조화",budget:"예산",fit:"체형·핏",occ:"상황·계절",color:"색상"};

function score(it, p, opt={}){

/* ---------- 코디 조합 ---------- */
function outfits(g, occ, n=5){
  const p = S.profile[g];
  const R = ranked(g,{occ}).filter(x=>x.it.occ.includes(occ) || x.sc.total>=70);
  const by = c => R.filter(x=>x.it.cat===c && x.it.seasons.includes(p.season)).concat(R.filter(x=>x.it.cat===c && !x.it.seasons.includes(p.season)));
  const tops=by("top"), bottoms=by("bottom"), dresses=by("dress"), outers=by("outer"), shoes=by("shoes"), bags=by("bag");
  const combos=[];
  for (const t of tops.slice(0,7)) for (const b of bottoms.slice(0,7)) combos.push({parts:[t,b], s:(t.sc.total+b.sc.total)/2 + pairH(t.it.color,b.it.color)*12});
  if (g==="F") for (const d of dresses.slice(0,4)) combos.push({parts:[d], s:d.sc.total + 9});
  combos.sort((a,b)=>b.s-a.s);
  const used=new Set(), picked=[];
  for (const c of combos){ if (picked.length>=n) break; if (c.parts.some(x=>used.has(x.it.id))) continue; picked.push(c); c.parts.forEach(x=>used.add(x.it.id)); }

  return picked.map(c=>{
    const base = c.parts.map(x=>x.it); const look={};
    base.forEach(it=>look[it.cat]=it);
    const harm = it => base.reduce((a,b)=>a+pairH(it.color,b.color),0)/base.length;
    if (needOuter && outers.length){ const o=[...outers].sort((a,b)=>(b.sc.total/100+harm(b.it))-(a.sc.total/100+harm(a.it)))[0]; if(o && (o.it.occ.includes(occ)||o.sc.total>=72)) look.outer=o.it; }
    const sh = [...shoes].sort((a,b)=>(b.sc.total/100+harm(b.it)+(b.it.occ.includes(occ)?.5:0))-(a.sc.total/100+harm(a.it)+(a.it.occ.includes(occ)?.5:0)))[0]; if (sh) look.shoes=sh.it;
    const bg = bags.find(x=>x.it.occ.includes(occ)); if (bg) look.bag=bg.it;
    const items = Object.values(look);
    const scoreAvg = Math.round(c.parts.reduce((a,x)=>a+x.sc.total,0)/c.parts.length);
    return {look, items, total:items.reduce((a,b)=>a+b.price,0), score:scoreAvg};
  });
}

  function mkRenderer(){ const r=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); r.outputEncoding=T.sRGBEncoding; r.toneMapping=T.NoToneMapping; r.shadowMap.enabled=true; r.shadowMap.type=T.PCFSoftShadowMap; r.setClearColor(0x000000,0); return r; }

    const key=new T.DirectionalLight(0xfff4ec,0.95); key.position.set(1.4,3.0,2.6); key.castShadow=true; key.shadow.mapSize.set(1024,1024);
    Object.assign(key.shadow.camera,{left:-1,right:1,top:2.3,bottom:-0.2,near:0.5,far:8}); key.shadow.bias=-0.0005; key.shadow.radius=5; sc.add(key);
    const rim=new T.DirectionalLight(0xffeef3,0.45); rim.position.set(-2,2.4,-2.2); sc.add(rim);
    const fill=new T.DirectionalLight(0xf3f6ff,0.18); fill.position.set(-2,1.2,2); sc.add(fill);

  // 라이브(회전 가능) 뷰 — 한 번에 하나
  let L=null;

    const loop=()=>{ requestAnimationFrame(loop); if (!L.host||!L.host.isConnected) return; if (ctl) ctl.update(); if (L.dirty||ctl&&ctl.autoRotate){ r.render(sc,cam); L.dirty=false; } };
    loop(); window.addEventListener("resize",()=>{ if (L.host&&L.host.isConnected) sizeLive(); }); return L; }
  function sizeLive(){ const w=L.host.clientWidth||300, h=L.host.clientHeight||400; L.r.setPixelRatio(Math.min(2,window.devicePixelRatio||1)); L.r.setSize(w,h,false); L.cam.aspect=w/h; L.cam.updateProjectionMatrix(); L.dirty=true; }

    L.fig=build(cfg.g,cfg.p,cfg.look||{},cfg.sizes||{}); L.sc.add(L.fig); L.cfg=cfg;
    if (reframe){ const H=cfg.p.height/100, {ty}=frame(L.cam,H,L.cam.aspect,cfg.theta??0.28); if (L.ctl){ L.ctl.target.set(0,ty,0); L.ctl.minDistance=L.cam.position.length()*0.45; L.ctl.maxDistance=L.cam.position.length()*1.4; L.ctl.update(); } }
    L.dirty=true; }

    if (b.dataset.fview!==undefined) view(+b.dataset.fview); else if (L.ctl){ L.ctl.autoRotate=!L.ctl.autoRotate; b.setAttribute("aria-pressed",L.ctl.autoRotate); } }, true);

  function snapshot(cfg, w, h, theta){ const key=[cfg.g,bodyKey(cfg.p),Object.values(cfg.look||{}).map(i=>i.id).join(","),JSON.stringify(cfg.sizes||{}),w,h,theta].join("#");

    setTimeout(pump,16); }

/* ---------- 실사 모델 피팅 (PhotoFit) — OTJAL · Rat Rae Choi ---------- */
const PhotoFit = (() => {
  const PAD = 56, imgs = {}, baseCache = {}, urlCache = new Map();
  function img(id){ if (!imgs[id]){ const im=new Image(); im.src=MODELS[id].src; imgs[id]=im; } return imgs[id]; }
  const isLoaded = id => { const im=img(id); return im.complete && im.naturalWidth>0; };
  const whenLoaded = id => isLoaded(id) ? Promise.resolve() : new Promise(r=>{ const im=img(id); im.addEventListener("load",r,{once:true}); im.addEventListener("error",r,{once:true}); });
  function pick(g,p){ if (p.model && p.model!=="auto" && MODELS[p.model] && MODELS[p.model].g===g) return p.model;
    let best=null, bd=1e9; for (const [id,m] of Object.entries(MODELS)){ if (m.g!==g) continue; const s=m.stats;
      const d=Math.abs(p.chest-s.chest)+Math.abs(p.waist-s.waist)*1.2+Math.abs(p.hip-s.hip)+Math.abs(p.shoulder-s.shoulder)*0.8; if (d<bd){ bd=d; best=id; } } return best; }
  function base(id){ if (baseCache[id]) return baseCache[id]; const m=MODELS[id], L=m.lm, W=L.W+PAD*2, H=L.H;
    const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d"); x.drawImage(img(id),PAD,0);
    const d=x.getImageData(0,0,W,H).data, lum=new Float32Array(W*H), al=new Uint8Array(W*H); let sum=0,n=0;
    for (let i=0,j=0;i<d.length;i+=4,j++){ lum[j]=d[i]*.3+d[i+1]*.59+d[i+2]*.11; al[j]=d[i+3]; }
    for (let y=Math.round(L.armpit); y<L.hipY; y+=2) for (let xx=-Math.round(L.waistW*0.6); xx<L.waistW*0.6; xx+=2){ const j=y*W+Math.round(L.xc+PAD+xx); if (al[j]>200){ sum+=lum[j]; n++; } }
    const blur=(src,r)=>{ const t=new Float32Array(W*H), o=new Float32Array(W*H);
      for (let y=0;y<H;y++){ let acc=0; const row=y*W; for (let x=-r;x<W;x++){ if (x+r<W) acc+=src[row+x+r]; if (x-r-1>=0) acc-=src[row+x-r-1]; if (x>=0) t[row+x]=acc; } }
      for (let x=0;x<W;x++){ let acc=0; for (let y=-r;y<H;y++){ if (y+r<H) acc+=t[(y+r)*W+x]; if (y-r-1>=0) acc-=t[(y-r-1)*W+x]; if (y>=0) o[y*W+x]=acc; } } return o; };
    const la=new Float32Array(W*H), aw=new Float32Array(W*H); for (let j=0;j<W*H;j++){ const w=al[j]>150?1:0; la[j]=lum[j]*w; aw[j]=w; }
    const ref=n?sum/n:170, bl=blur(la,9), bw=blur(aw,9), det=new Float32Array(W*H), low=new Float32Array(W*H);
    for (let j=0;j<W*H;j++){ const m=bw[j]>0? bl[j]/bw[j] : 0; det[j]= m>0 && al[j]>150 ? Math.min(1.25,Math.max(.72,lum[j]/m)) : 1; low[j]= m>0 ? Math.min(1.12,Math.max(.8,m/ref)) : 1; }
    return baseCache[id]={c,W,H,lum,al,det,low,ref}; }
  // 원단 패턴 타일
  const tiles={};
  function tile(kind,hex){ const k=kind+hex; if (tiles[k]) return tiles[k]; const S=64, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
    let s=parseInt(hex.slice(1),16)%9973+7; const R=()=> (s=(s*16807)%2147483647)/2147483647;

      if (/가디건/.test(nm)){ line(x,[[cx,L.neck+neckDepth+4],[cx,hemY-2]],dk,1.2,.5); for (let y=L.neck+neckDepth+14; y<hemY-6; y+=22) dot(x,cx,y,2.6,"#FFF9EF"); }
      if (/리본/.test(nm)){ x.save(); x.fillStyle=x.createPattern(tile(kindOf(it),shade(c,.04)),"repeat"); x.strokeStyle=dk; x.globalAlpha=.95;
        for (const s of [-1,1]){ const r=new Path2D(); r.ellipse(cx+s*10,L.neck+14,11,6,s*.35,0,7); x.fill(r); x.stroke(r); const t=new Path2D(); t.moveTo(cx+s*2,L.neck+16); t.lineTo(cx+s*12,L.neck+58); t.lineTo(cx+s*5,L.neck+60); t.closePath(); x.fill(t); } x.restore(); }
      if (/후드/.test(nm)){ const h=new Path2D(); h.ellipse(cx,L.neck+2,neckW*1.15,16,0,0,Math.PI); x.save(); x.fillStyle=x.createPattern(tile(kindOf(it),shade(c,-.06)),"repeat"); x.fill(h); x.restore();
        for (const s of [-1,1]) line(x,[[cx+s*7,L.neck+12],[cx+s*8,L.neck+64]],shade(c,-.4),1.6,.8); }
      if (/니트|맨투맨|후드|가디건/.test(nm) && !isD) line(x,[[cx-hemX+2,hemY-4],[cx+hemX-2,hemY-4]],dk,7,.25);
      if (/패딩|다운/.test(nm)){ line(x,[[cx,L.neck+6],[cx,hemY-2]],"#c8c8c8",1.6,.9); }
      if (/플라워/.test(nm) && isD) line(x,[[cx-wX,L.waistY],[cx+wX,L.waistY]],dk,1.4,.4);
    }
    if (look.dress) upper(look.dress,"dress"); else if (look.top) upper(look.top,"top");
    if (look.outer) upper(look.outer,"outer");
    // ---- 가방
    if (look.bag){ const it=look.bag, x=newLayer(.6,.3), nm=it.name, c=COLORS[it.color].h, dk=shade(c,-.35);
      const small=/미니|크로스/.test(nm), held=/브리프|토트/.test(nm), s=1;
      let bx,by,bw,bh;
      if (held){ bw=small?36:58; bh=small?28:46; bx=cx+s*L.armXwr-bw/2; by=L.wristY+30; line(x,[[cx+s*L.armXwr-10,by],[cx+s*L.armXwr,by-14],[cx+s*L.armXwr+10,by]],dk,2.4,.9); }
      else { bw=small?34:48; bh=small?26:38; bx=cx+s*(Math.max(L.hipW,botH)+6); by=L.hipY-18;
        if (/크로스/.test(nm)) line(x,[[cx-s*L.shW*0.6,L.shoulder],[cx,L.armpit+30],[bx+6,by+2]],dk,2.6,.9); else line(x,[[cx+s*(L.shW*0.62),L.shoulder-1],[cx+s*(L.shW*0.95),L.armpit],[bx+bw*0.5,by]],dk,2.4,.9); }
      const pa=new Path2D(); pa.roundRect ? pa.roundRect(bx,by,bw,bh,5) : pa.rect(bx,by,bw,bh); boxes.set(pa,{x0:bx,x1:bx+bw}); fill(x,it,pa); }

    // ---- 레이어 명암 적용 + 합성
    for (const Ly of layers){ const d=Ly.x.getImageData(0,0,W,H), a=d.data, k=Ly.k;
      for (let i=0,j=0;i<a.length;i+=4,j++){ if (!a[i+3]) continue; const s=(1+(B.det[j]-1)*k)*(1+(B.low[j]-1)*.35); a[i]=Math.min(255,a[i]*s); a[i+1]=Math.min(255,a[i+1]*s); a[i+2]=Math.min(255,a[i+2]*s); }
      Ly.x.putImageData(d,0,0);
      o.save(); o.shadowColor=`rgba(45,28,22,${Ly.sh})`; o.shadowBlur=9; o.shadowOffsetY=2; o.drawImage(Ly.c,0,0); o.restore(); }
    // 손은 항상 옷 위로 (코트·스커트에 가려지지 않게)
    if (look.outer || bot || look.dress) for (const s of [-1,1]){ o.save(); const cl=new Path2D(); cl.ellipse(cx+s*(L.armXwr+L.armR*0.25), L.wristY+40, L.armR*0.95, 32, 0, 0, 7); o.clip(cl); o.drawImage(B.c,0,0); o.restore(); }
    return {canvas:out, id, label:m.label};
  }
  function sx(g,p,id){ const s=MODELS[id].stats; return Math.max(.9,Math.min(1.1,Math.pow((p.chest+p.waist+p.hip)/(s.chest+s.waist+s.hip),.7))); }
  // 카드·상세용 이미지
  function key(cfg){ return [cfg.g,pick(cfg.g,cfg.p),["chest","waist","hip","thigh","shoulder","fitTop","fitBottom","fitOuter"].map(k=>cfg.p[k]).join(","),Object.values(cfg.look||{}).map(i=>i.id).join(","),JSON.stringify(cfg.sizes||{})].join("#"); }
  function toURL(cfg){ const k=key(cfg); if (urlCache.has(k)) return urlCache.get(k); const r=render(cfg.g,cfg.p,cfg.look||{},cfg.sizes||{});
    const sc=sx(cfg.g,cfg.p,r.id), c=document.createElement("canvas"); c.width=Math.round(r.canvas.width*sc); c.height=r.canvas.height; c.getContext("2d").drawImage(r.canvas,0,0,c.width,c.height);
    const u=c.toDataURL("image/webp",.9); if (urlCache.size>120) urlCache.delete(urlCache.keys().next().value); urlCache.set(k,u); return u; }
  const q=[]; let busy=false;
  function pump(){ if (!q.length){ busy=false; return; } busy=true; const j=q.shift();
    if (j.el.isConnected){ try { const u=toURL(j.cfg); j.el.innerHTML=`<img alt="실사 모델 착용 이미지" src="${u}">`; if (j.badge) j.el.insertAdjacentHTML("beforeend",j.badge(MODELS[pick(j.cfg.g,j.cfg.p)].label)); } catch(e){ j.el.innerHTML=j.fb; } }
    setTimeout(pump,8); }
  function queue(el,cfg,fb,badge){ const id=pick(cfg.g,cfg.p); whenLoaded(id).then(()=>{ q.push({el,cfg,fb,badge}); if (!busy) pump(); }); }
  return {pick, queue, toURL, whenLoaded};
})();

document.addEventListener("click", e => {
  const b = e.target.closest("button, a[data-go]"); if (!b) return;
  const d = b.dataset, g = S.g, p = P();
  if (d.go){ e.preventDefault(); go(d.go); return; }
  if (d.g){ S.g = d.g; save(); render(); return; }
  if (d.occ){ S.pick = {occ:d.occ, i:0}; save(); render(); return; }
  if (d.cocc){ S.coordOcc = d.cocc; save(); render(); return; }
  if (d.cat){ S.recCat = d.cat; save(); render(); return; }
  if (d.sort){ S.recSort = d.sort; save(); render(); return; }
  if (d.site){ S.sites = S.sites.includes(d.site) ? S.sites.filter(x=>x!==d.site) : [...S.sites, d.site]; save(); b.setAttribute("aria-pressed", S.sites.includes(d.site)); return; }
  if (d.one){ p[d.one] = d.v; save(); render(); return; }
  if (d.multi){ const a=p[d.multi]||[]; p[d.multi] = a.includes(d.v) ? a.filter(x=>x!==d.v) : [...a, d.v]; save(); b.setAttribute("aria-pressed", p[d.multi].includes(d.v)); if (S.tab==="style") refreshPreview(); return; }
  if (d.preset!=null){ const t=SZ[g], i=+d.preset; Object.assign(p,{shoulder:t.shoulder[i],chest:mid(t.chest[i]),waist:mid(t.waist[i]),hip:mid(t.hip[i])}); save(); render(); return; }
  if (d.rmcl!=null){ S.closet[g].splice(+d.rmcl,1); save(); render(); return; }
  if (b.id==="clAdd"){ (S.closet[g] ||= []).push({cat:$("#clCat").value, color:$("#clColor").value}); save(); render(); return; }
  if (b.id==="reset1"){ $("#resetBox").innerHTML = `<span class="small"><b>정말 지울까요?</b> 체형·취향·옷장·찜이 모두 기본값으로 돌아가요.</span><button class="btn sm pri" id="reset2">지우기</button><button class="btn sm" id="reset0">취소</button>`; return; }

  if (b.id==="reset0"){ render(); return; }
  if (d.size){ S.fit[g].size[d.size] = +d.i; save(); render(); return; }
  if (d.close!==undefined){ $("#shopDlg").close(); return; }
  if (d.themeSet){ S.theme=d.themeSet; save(); renderTabs(); return; }
  if (d.dsize){ S.fit[g].size[d.dsize] = +d.i; save(); render(); openDetail(d.dsize); return; }
  if (d.more){ S.recOpen[d.more] = !S.recOpen[d.more]; save(); render(); return; }
  if (d.jump){ const el=$("#sec-"+d.jump); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const inDlg = !!b.closest("#shopDlg");
  switch (d.act){
    case "detail": openDetail(d.id); break;
    case "view3d": S.view3d=true; save(); render(); break;
    case "viewPhoto": S.view3d=false; save(); render(); break;
    case "logo": { const dl=$("#shopDlg"); if (dl.open) dl.close(); S.tab="home"; S.pick.i=0; save(); render(); window.scrollTo({top:0}); break; }
    case "qr": openQR(); break;
    case "refer": openRefer(); break;
    case "copyRefer": copyText(referText(), $("#referNote")); break;
    case "share": { const t=referText(); try { if (window.OTJALApp && OTJALApp.share){ OTJALApp.share(t); break; } } catch(e){}
      if (navigator.share) navigator.share({title:"OTJAL", text:t}).catch(()=>copyText(t,$("#referNote"))); else copyText(t,$("#referNote")); break; }
    case "estimate": estimateBody(); save(); render(); break;
    case "budgetPreset": { const f=+d.v, base=g==="F"?{top:60000,bottom:60000,dress:80000,outer:160000,shoes:80000,bag:70000}:{top:60000,bottom:70000,dress:80000,outer:180000,shoes:100000,bag:90000};
      for (const k in base) p.budget[k]=Math.round(base[k]*f/5000)*5000; save(); render(); break; }
    case "wReset": p.w={style:30,closet:20,budget:15,fit:15,occ:10,color:10}; save(); render(); break;
    case "wear": { const it=BYID[d.id]; wear(it); save(); render(); if (inDlg) openDetail(d.id); break; }
    case "pvDress": S.previewDress = d.v==="1"; save(); render(); break;
    case "autoSize": S.fit[g].size = {}; save(); render(); break;
    case "sitesAll": S.sites = SITES.map(s=>s.id); save(); render(); break;
    case "sitesNone": S.sites = []; save(); render(); break;
    case "repick": S.pick.i++; save(); render(); const st=$("#stage"); if(st){ st.classList.remove("pop"); void st.offsetWidth; st.classList.add("pop"); } break;
    case "wish": S.wish = S.wish.includes(d.id) ? S.wish.filter(x=>x!==d.id) : [...S.wish, d.id]; save(); render(); if (inDlg) openDetail(d.id); break;
    case "like": for (const s of BYID[d.id].styles) S.likes[g+s]=(S.likes[g+s]||0)+1; save(); b.textContent="반영했어요"; b.disabled=true; break;
    case "hide": S.hides.push(d.id); save(); render(); break;
    case "unhide": S.hides = S.hides.filter(id=>BYID[id].g!==g); save(); render(); break;
    case "top3": S.top3 = !S.top3; save(); render(); break;
    case "q": S.q = $("#q").value; save(); $("#qOut").innerHTML = qBlock() || `<p class="note" style="margin:0">찾는 옷을 입력해 주세요.</p>`; break;
    case "shop": { const it=BYID[d.id]; openShop([{label:it.name, kw:kwFor(it)}], it.name); break; }
    case "try": { wear(BYID[d.id]); save(); if (inDlg) $("#shopDlg").close(); go("fit"); break; }
    case "shopLook": { const o=outfits(g,d.o,5)[+d.li]; if(o) openShop(o.items.map(it=>({label:`${CATNAME[it.cat]} · ${it.name}`, kw:kwFor(it)})), `${d.o}룩 한번에 찾기`); break; }
    case "tryLook": { const o=outfits(g,d.o,5)[+d.li]; if(o){ const f=S.fit[g]; for (const c of ["top","bottom","dress","outer","shoes","bag"]) f[c] = o.look[c] ? o.look[c].id : ""; save(); go("fit"); } break; }
    case "shopFit": { const l=Object.values(curLook()); if(l.length) openShop(l.map(it=>({label:`${CATNAME[it.cat]} · ${it.name}`, kw:kwFor(it)})), "피팅룸 착장 찾기"); break; }
    case "shopWish": { const l=S.wish.map(id=>BYID[id]).filter(it=>it.g===g); openShop(l.map(it=>({label:it.name, kw:kwFor(it)})), "찜 목록 찾기"); break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.slot!==undefined){ const f=S.fit[S.g], c=el.dataset.slot; f[c]=el.value;
    if (c==="dress" && el.value){ f.top=""; f.bottom=""; } if ((c==="top"||c==="bottom") && el.value) f.dress=""; save(); render(); }
});
document.addEventListener("keydown", e => { if (e.target.id==="q" && e.key==="Enter"){ e.preventDefault(); S.q=e.target.value; save(); $("#qOut").innerHTML = qBlock(); } });
$("#shopDlg").addEventListener("click", e => { if (e.target.id==="shopDlg") e.target.close(); });

if ("serviceWorker" in navigator && location.protocol==="https:" && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(()=>{});
const H = (location.hash||"").slice(1); if (TABS.some(t=>t[0]===H)) S.tab = H;
render();
</script>

</body></html>

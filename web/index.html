<title>OTJAL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* OTJAL v0.3 — bright, refined: pure white + blush mist, rose accent used sparingly, champagne hairlines.
   Layout: slim utility bar → brand bar → tab strip; each tab is a working screen with a live 3D figure stage. */
:root{
  --bg:#FFFFFF; --bg2:#FBF6F4; --surface:#FFFFFF; --ink:#27262B; --ink2:#4A4850; --muted:#8C8892; --line:#EFE7E4; --chip:#F8F2F0;
  --accF:#E0577D; --accM:#4467D8; --acc:var(--accF); --accSoft:#FCEBF0; --accSoftM:#ECF0FC; --soft:var(--accSoft);
  --gold:#C9A27C; --onAcc:#FFFFFF;
  --mq:#EADDD3; --mqLine:#D6C4B7; --hair:#4A3528;
  --good:#2E8A62; --warn:#B98318; --bad:#D04545;
  --stage1:#FFFFFF; --stage2:#F6ECE8;
  --sh:0 1px 2px rgba(39,38,43,.04),0 12px 32px rgba(39,38,43,.06);
  --f-display:"Cormorant Garamond","Noto Serif KR",Georgia,serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141317; --bg2:#19181D; --surface:#1D1C21; --ink:#F2EEF0; --ink2:#D5D0D6; --muted:#A29DA6; --line:#2E2C33; --chip:#25232A;
  --accF:#F27A9B; --accM:#829DFF; --accSoft:#3A2530; --accSoftM:#232B45; --gold:#D9B894;
  --mq:#5C4E47; --mqLine:#77655C; --hair:#120E0D; --good:#61C894; --warn:#E3B04B; --bad:#FF7272;
  --stage1:#24222A; --stage2:#1A191E; --sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141317; --bg2:#19181D; --surface:#1D1C21; --ink:#F2EEF0; --ink2:#D5D0D6; --muted:#A29DA6; --line:#2E2C33; --chip:#25232A;
  --accF:#F27A9B; --accM:#829DFF; --accSoft:#3A2530; --accSoftM:#232B45; --gold:#D9B894;
  --mq:#5C4E47; --mqLine:#77655C; --hair:#120E0D; --good:#61C894; --warn:#E3B04B; --bad:#FF7272;
  --stage1:#24222A; --stage2:#1A191E; --sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.3); color-scheme:dark }
:root[data-g="M"]{ --acc:var(--accM); --soft:var(--accSoftM); --lgF:0; --lgM:1 }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;font-weight:400;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.util{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-block:6px 0;font-size:12.5px}
.ubtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);padding:5px 10px;border-radius:999px;font-weight:500}
.ubtn:hover{background:var(--chip);color:var(--ink)}
.ubtn svg{width:15px;height:15px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:2px;margin-left:4px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:999px;font-size:12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{display:flex;align-items:center;gap:16px;padding-block:6px 4px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);border:0;background:none;padding:0}
.brand svg{width:36px;height:36px;flex:none}
.wm{display:flex;align-items:baseline;gap:8px;line-height:1}
.wm b{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.16em}
.ver{font-size:10.5px;font-weight:500;color:var(--acc);background:var(--soft);border-radius:999px;padding:2px 7px;letter-spacing:.02em;align-self:center}
.spacer{flex:1}
.gsw{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.gsw button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:500;font-size:13px;color:var(--muted)}
.gsw button[aria-pressed="true"]{background:var(--surface);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:700}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 14px 11px;font-weight:500;font-size:14.5px;color:var(--muted);white-space:nowrap;position:relative}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:var(--acc)}
nav.tabs .cnt{font-size:10.5px;background:var(--acc);color:var(--onAcc);border-radius:99px;padding:0 6px;margin-left:5px;font-weight:700}

main{padding-block:28px 64px}
section.tab{display:flex;flex-direction:column;gap:30px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.035em;font-weight:700}
h2{font-size:clamp(24px,3vw,30px)}
h3{font-size:18px}
.eyebrow{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:16px;letter-spacing:.04em;color:var(--acc)}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--muted);line-height:1.65}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:6px 0 0;max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onAcc);font-weight:700}
.btn.pri:hover{filter:brightness(1.06);color:var(--onAcc)}
.btn.big{padding:15px 28px;font-size:16px}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;background:var(--chip);border-radius:999px;padding:2px 9px;color:var(--ink2)}
.tag.ok{color:var(--good)} .tag.loose{color:var(--warn)} .tag.bad{color:var(--bad)}
.sticker{display:inline-flex;align-items:center;font-family:var(--f-display);font-style:italic;font-weight:700;font-size:15px;letter-spacing:.03em;background:var(--surface);color:var(--acc);border:1px solid var(--line);padding:2px 12px;border-radius:999px;box-shadow:var(--sh)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--sh)}

/* 3D figure */
.fig{position:relative;width:100%;background:radial-gradient(120% 80% at 50% 25%,var(--stage1),var(--stage2));border-radius:18px;overflow:hidden;display:grid;place-items:center}
.fig canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y}
.fig img{display:block;width:100%;height:100%;object-fit:contain}
.fig .av{width:auto;height:92%;max-width:100%}
.fig .fctl{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.fig .fctl button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;font-size:11.5px;padding:4px 10px}
.fig .fctl button[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}
.fig .fbadge{position:absolute;right:12px;top:12px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 9px;border-radius:999px}
.fig .fload{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fig.live{aspect-ratio:3/4.1;max-height:640px}
.fig.card{aspect-ratio:3/4.2;border-radius:0}
.fig.look{aspect-ratio:3/4.4;border-radius:14px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:stretch;background:linear-gradient(135deg,var(--bg2),var(--surface) 70%);border:1px solid var(--line);border-radius:28px;padding:28px}
.hero-l{display:flex;flex-direction:column;gap:20px;justify-content:center;padding:12px 8px}
.hero h1{font-size:clamp(29px,3.9vw,48px);font-weight:700;line-height:1.12;letter-spacing:-.045em}
.hero h1 em{font-style:normal;color:var(--acc);font-family:var(--f-display);font-weight:700;letter-spacing:.02em}
.hero p.lead{font-size:16px;color:var(--ink2);margin:0;max-width:44ch;font-weight:400}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:center}
.stage>.sticker{position:absolute;top:12px;left:12px;z-index:2}
.lookList{display:flex;flex-direction:column;gap:9px;min-width:0}
.lookItem{display:flex;gap:10px;align-items:center;font-size:13px;min-width:0}
.lookItem .th{width:44px;height:44px;flex:none;background:var(--chip);border-radius:12px;display:grid;place-items:center}
.lookItem .th svg{width:34px;height:34px}
.lookItem b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{font-size:13.5px;border-top:1px solid var(--line);padding-top:9px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.total b{font-weight:700}
.pain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pain div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.pain b{font-size:16px;display:block;margin-bottom:4px;font-weight:700}
.pain i{font-family:var(--f-display);font-style:italic;color:var(--gold);font-size:22px;display:block;line-height:1}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card .img{position:relative;background:var(--chip);border:0;padding:0;width:100%;cursor:pointer;color:inherit;display:grid;grid-template-columns:.8fr 1.2fr;align-items:end}
.card .img .g{display:grid;place-items:center;height:100%}
.card .img .g svg{width:80%;height:auto}
.card .img .a{height:100%}
.card .img .a .fig{height:100%;background:transparent}
.card .score{position:absolute;top:10px;right:10px;background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.06);z-index:2}
.card .score b{color:var(--acc)}
.card .ex{position:absolute;bottom:8px;left:12px;font-size:10.5px;color:var(--muted);z-index:2}
.card .rank{position:absolute;top:10px;left:10px;z-index:2;font-size:13px;padding:1px 10px}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .nm{font-weight:700;font-size:15.5px;line-height:1.35;letter-spacing:-.03em}
.card .pr{font-size:14.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.card .why{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.card .why span::before{content:"· ";color:var(--acc);font-weight:700}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;font-size:11.5px;align-items:center;margin-top:6px}
.bars i{display:block;height:5px;border-radius:9px;background:var(--chip);overflow:hidden}
.bars i b{display:block;height:100%;background:var(--acc)}
.bars em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.input{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;width:100%}
.sites{display:flex;flex-wrap:wrap;gap:6px}
.site{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;background:var(--surface)}
.site:hover{border-color:var(--acc);color:var(--acc)}
.site i{width:7px;height:7px;border-radius:50%;display:inline-block}
.sg{display:flex;flex-direction:column;gap:6px}
.sg>span{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}

/* coordi */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.look{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;box-shadow:var(--sh)}
.look h3{font-size:16px}

/* fitting */
.fit{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:22px;align-items:start}
.fitStage{position:sticky;top:132px;display:flex;flex-direction:column;gap:12px}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center}
.slot .th{width:58px;height:58px;background:var(--chip);border-radius:14px;display:grid;place-items:center}
.slot .th svg{width:46px;height:46px}
.slot .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;max-width:100%;min-width:0}
.sizes{display:flex;gap:4px;flex-wrap:wrap}
.sizes button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:500}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sizes button.rec{box-shadow:inset 0 -2px 0 var(--acc)}
.av{width:100%;height:auto;display:block}

/* profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.fs{display:flex;flex-direction:column;gap:14px}
.fs h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fs h3 small{font-size:12.5px;color:var(--muted);font-weight:400;letter-spacing:0}
.sub{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 11px;color:var(--ink);font-size:14px;width:100%;font-variant-numeric:tabular-nums}
.rng{display:grid;grid-template-columns:92px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.rng input{width:100%;accent-color:var(--acc)}
.rng output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--surface) inset}
.sw[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6)}
.sw.no[aria-pressed="true"]::after{content:"✕"}
.swl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);width:54px;text-align:center}
.side{position:sticky;top:132px;display:flex;flex-direction:column;gap:12px}
.closet{display:flex;flex-wrap:wrap;gap:6px}
.closet .tag button{border:0;background:none;padding:0 0 0 4px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.measure{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.mbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mbox label{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.mbox label b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.mbox input[type=range]{width:100%;accent-color:var(--acc)}

/* wish */
.wl{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.wrow .th{width:56px;height:56px;background:var(--chip);border-radius:12px;display:grid;place-items:center}
.wrow .th svg{width:44px;height:44px}

/* brand */
.bgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.logoBig{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logoBig svg{width:110px;height:110px}
.logoBig .wm b{font-size:72px}
.icons{display:flex;gap:16px;flex-wrap:wrap}
.icons div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.icons svg{width:80px;height:80px}
.slogan{font-size:clamp(26px,3.6vw,40px);font-weight:700;line-height:1.25;letter-spacing:-.04em}
.slist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.slist li{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.slist li span{font-size:11.5px;color:var(--muted);min-width:70px}
.slist li b{font-size:18px;font-weight:700;letter-spacing:-.03em}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pal div{border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:12px}
.pal i{display:block;height:56px}
.pal p{margin:0;padding:8px 10px}

footer{border-top:1px solid var(--line);padding-block:24px 30px;background:var(--bg2)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
footer .sig{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--ink)}

dialog{border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:88vh;box-shadow:0 30px 80px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(30,26,32,.35);backdrop-filter:blur(3px)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg .kw{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  function clothMat(it){ const hex=COLORS[it.color].h, k=fabricKind(it);

  const V2=(r,y)=>new T.Vector2(Math.max(r,1e-4),y);

    const m=new T.Mesh(geo,mat); m.castShadow=true; m.receiveShadow=true; return m; }
  function ell(rx,ry,rz,mat){ const m=new T.Mesh(new T.SphereGeometry(1,40,28),mat); m.scale.set(rx,ry,rz); m.castShadow=true; m.receiveShadow=true; return m; }
  function rAt(pts,y){ for(let i=0;i<pts.length-1;i++){ const [r0,y0]=pts[i],[r1,y1]=pts[i+1]; if ((y>=y0&&y<=y1)||(y<=y0&&y>=y1)) return r0+(r1-r0)*((y-y0)/((y1-y0)||1)); } return pts[pts.length-1][0]; }
  const incY = pts => pts.filter((q,i)=> i===0 || q[1] > pts.slice(0,i).reduce((m,z)=>Math.max(m,z[1]),-9)+0.004);
  function pleat(geo, yTop, yBot, N, amp){ const a=geo.attributes.position; for(let i=0;i<a.count;i++){ const x=a.getX(i), y=a.getY(i), z=a.getZ(i);
      const t=Math.max(0,Math.min(1,(yTop-y)/((yTop-yBot)||1))); const f=1+amp*t*Math.sin(N*Math.atan2(x,z)); a.setX(i,x*f); a.setZ(i,z*f); } a.needsUpdate=true; geo.computeVertexNormals(); }

  function build(g, p, look, sizes){
    const root=new T.Group(), k=0.01, H=p.height*k, hs=H/1.65;
    const Rc = c => c/(2*Math.PI)*k*1.17, DZ = g==="F"?0.70:0.68;
    const sizeOf = it => (sizes && sizes[it.id]!=null) ? sizes[it.id] : ((recSize(it,p)||{}).idx ?? 2);
    const yCr=Math.min(p.inseam*k, H*0.5), yHip=yCr+H*0.055, yWaist=yCr+H*(g==="F"?0.15:0.135);
    const sht=({"직각":0.008,"보통":0,"처진":-0.012})[p.shoulderType]||0;
    const yUnder=H*0.69, yChest=H*0.725, yArm=H*0.75, ySh=H*(0.818+sht), yNeck=H*0.842, yHead=H-0.108*hs;
    const yKnee=yCr*0.56, yCalf=yKnee*0.66, yAnk=0.075;
    const rHip=Rc(p.hip), rWaist=Rc(p.waist), rChest=Rc(p.chest), rRib=g==="F"?Rc(p.underbust||p.chest-12)*1.04:rChest;
    const rSh=p.shoulder*k/2, rNeck=(g==="F"?0.047:0.056)*hs;
    const rThigh=p.thigh/(2*Math.PI)*k, rCalf=p.calf/(2*Math.PI)*k, rKnee=Math.max(rCalf*1.02,rThigh*0.66), rAnkle=g==="F"?0.031:0.036;

    const skin=new T.MeshPhysicalMaterial({color:SKIN[p.skin]||SKIN["밝은"], roughness:.55, clearcoat:.08, clearcoatRoughness:.6, envMapIntensity:.3});

    // 목·머리·얼굴

    const hz=(x,y)=>{ const r=rAt(headP,y*hs)/hs; return 1.2*r*Math.sqrt(Math.max(0,1-(x/r)**2))*hs+0.004; };
    for (const s of [-1,1]){ const e=ell(0.011*hs,0.022*hs,0.014*hs,skin); e.position.set(s*0.072*hs,yHead-0.008*hs,0); root.add(e); }
    const eyeM=new T.MeshPhysicalMaterial({color:"#2a201d",roughness:.2,clearcoat:1}), hlM=new T.MeshBasicMaterial({color:"#ffffff"});

      const eye=ell(0.0105*hs,0.0075*hs,0.005*hs,eyeM); eye.position.set(s*0.027*hs,yHead+0.004*hs,hz(0.027,0.004)-0.002*hs); root.add(eye);

      const brow=ell(0.016*hs,0.0026*hs,0.003*hs,browM); brow.position.set(s*0.028*hs,yHead+0.026*hs,hz(0.028,0.026)); brow.rotation.z=s*-0.12; root.add(brow); }
    const nose=ell(0.008*hs,0.017*hs,0.011*hs,skin); nose.position.set(0,yHead-0.02*hs,hz(0,-0.02)-0.004*hs); root.add(nose);
    const lip=ell(0.016*hs,0.005*hs,0.006*hs,new T.MeshPhysicalMaterial({color:g==="F"?"#C9707B":"#B47E72",roughness:.35,clearcoat:.4})); lip.position.set(0,yHead-0.056*hs,hz(0,-0.056)-0.002*hs); root.add(lip);
    if (g==="F") for (const s of [-1,1]){ const bl=ell(0.016*hs,0.009*hs,0.004*hs,new T.MeshBasicMaterial({color:"#F3A6A6",transparent:true,opacity:.3})); bl.position.set(s*0.045*hs,yHead-0.03*hs,hz(0.045,-0.03)-0.001); root.add(bl); }
    // 헤어
    const hairM=new T.MeshPhysicalMaterial({color:HAIRC[p.hairColor]||"#2F2420",roughness:.45,clearcoat:.25,clearcoatRoughness:.5,side:T.DoubleSide,envMapIntensity:.3});
    { const capP=headP.filter(([r,y])=>y>=-0.045*hs).map(([r,y])=>[r*1.07+0.002,y*1.04+0.004*hs]); const geo=new T.LatheGeometry(smoothPts(capP,40),64); const a=geo.attributes.position;
      for (let i=0;i<a.count;i++){ const x=a.getX(i), y=a.getY(i), z=a.getZ(i), c=Math.cos(Math.atan2(x,z));

      if (g==="F" && p.hair!=="숏"){ const bang=ell(0.05*hs,0.013*hs,0.011*hs,hairM); bang.position.set(0.014*hs,yHead+0.06*hs,hz(0.014,0.06)-0.004*hs); bang.rotation.z=-0.32; root.add(bang); } }
    if (p.hair==="묶음"){ const bun=ell(0.045*hs,0.045*hs,0.045*hs,hairM); bun.position.set(0,yHead+0.06*hs,-0.085*hs); root.add(bun); }
    else if (p.hair && p.hair!=="숏"){ const yEnd = p.hair==="단발"? yHead-0.12*hs : p.hair==="중단발"? ySh-0.03 : yChest-0.05;
      const back=latheMesh([[0.06*hs,yEnd-0.006],[p.hair==="긴머리"?0.112*hs:0.096*hs,yEnd],[0.09*hs,Math.max(yEnd+0.05,yHead-0.13*hs)],[0.082*hs,yHead-0.09*hs],[0.085*hs,yHead-0.03*hs],[0.077*hs,yHead+0.03*hs]], hairM, {phiStart:Math.PI*0.6, phiLen:Math.PI*0.8, seg:40});

    // 팔

    for (const s of [-1,1]){ const grp=new T.Group(); grp.position.set(s*(rSh-rUA*0.6), ySh-H*0.028, 0); grp.rotation.z=s*0.13;
      const up=armL*0.54, rEl=rUA*0.72, rFo=rUA*0.8, rWr=g==="F"?0.024:0.028;

    // ----- 옷 -----

        const band=new T.Mesh(new T.TorusGeometry(wG*1.005,0.006,8,64),new T.MeshPhysicalMaterial({color:shade(COLORS[it.color].h,-.15),roughness:.7})); band.rotation.x=Math.PI/2; band.scale.y=DZ*1.06; band.position.y=yWaist+0.004; root.add(band);

          else if (/부츠컷/.test(nm)){ kneeR=rKnee+0.009; hemR=rCalf+0.032; }
          else if (/조거/.test(nm)){ kneeR=rKnee+0.02; hemR=rAnkle+0.008; }
          else if (/스트레이트|치노|데님/.test(nm)){ kneeR=rKnee+0.018; hemR=rKnee+0.012; }
          else { kneeR=rKnee+0.014; hemR=rAnkle+0.022; }
          const pts = short ? [[thG*1.05,yHem],[thG*1.03,(yHem+yCr)/2],[thG,yCr+0.03]] : [[hemR,yHem],[(hemR+kneeR)/2,(yHem+yKnee)/2],[kneeR,yKnee],[(kneeR+thG)/2,(yKnee+yCr)/2],[thG,yCr+0.03]];

    }
    let topProf=null;
    function upperLayer(it, layer){

      else yHem = /크롭/.test(nm) ? yWaist+0.025 : it.fit==="over" ? yHip-0.06 : yHip-0.025;

      if (isD){ const wW=Math.max(rWaist+0.008,Rc(G.waist)); pts.push([/플라워|린넨/.test(nm)?rHp*1.45:rHp*1.12,yHem]); if (yHem<yHip) pts.push([rHp*1.06,yHip]); pts.push([wW,yWaist]); }

      if (isO && /트위드/.test(nm)){ const gb=new T.MeshPhysicalMaterial({color:"#D8B66A",metalness:.85,roughness:.25});
        for (let y=yChest; y>yHem+0.02; y-=0.055) for (const s of [-1,1]){ const b=new T.Mesh(new T.CylinderGeometry(0.0065,0.0065,0.004,16),gb); b.rotation.x=Math.PI/2; b.position.set(s*(Math.sin(gap)*rC+0.012),y,frontZ(y)*Math.cos(gap)+0.003); root.add(b);} }
    }
    function shoesLayer(it){ const mat=clothMat(it), nm=it.name, sneaker=/스니커즈|러닝|캔버스/.test(nm), heel=/펌프스|슬링백/.test(nm), boot=/부츠/.test(nm);

      for (const L of legs){ const yT=L.userData.yTop;

  function mkRenderer(){ const r=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}); r.outputEncoding=T.sRGBEncoding; r.toneMapping=T.NoToneMapping; r.shadowMap.enabled=true; r.shadowMap.type=T.PCFSoftShadowMap; r.setClearColor(0x000000,0); return r; }

    const key=new T.DirectionalLight(0xfff4ec,0.95); key.position.set(1.4,3.0,2.6); key.castShadow=true; key.shadow.mapSize.set(1024,1024);
    Object.assign(key.shadow.camera,{left:-1,right:1,top:2.3,bottom:-0.2,near:0.5,far:8}); key.shadow.bias=-0.0005; key.shadow.radius=5; sc.add(key);

    const fill=new T.DirectionalLight(0xf3f6ff,0.18); fill.position.set(-2,1.2,2); sc.add(fill);

    L={r,sc,cam,ctl,fig:null,host:null,dirty:true};
    if (ctl) ctl.addEventListener("change",()=>{ L.dirty=true; });

    if (reframe){ const H=cfg.p.height/100, {ty}=frame(L.cam,H,L.cam.aspect,cfg.theta??0.28); if (L.ctl){ L.ctl.target.set(0,ty,0); L.ctl.minDistance=L.cam.position.length()*0.45; L.ctl.maxDistance=L.cam.position.length()*1.4; L.ctl.update(); } }

  function mountLive(host, cfg, opts={}){ const l=ensureLive(); l.host=host; host.innerHTML=""; host.appendChild(l.r.domElement);
    const bar=document.createElement("div"); bar.className="fctl";
    bar.innerHTML=`<button data-fview="0">정면</button><button data-fview="1.5708">측면</button><button data-fview="3.1416">후면</button><button data-fspin aria-pressed="${!!(l.ctl&&l.ctl.autoRotate)}">회전</button>`;
    host.appendChild(bar);

  function update(cfg){ if (!L||!L.host||!L.host.isConnected) return false; setFig(Object.assign({},L.cfg,cfg), false); return true; }
  document.addEventListener("click", e=>{ const b=e.target.closest("[data-fview],[data-fspin]"); if (!b||!L) return; e.stopPropagation();

function curLook(g=S.g){ const f=S.fit[g], look={}; for (const c of ["top","bottom","dress","outer","shoes","bag"]) if (f[c] && BYID[f[c]]) look[c]=BYID[f[c]]; return look; }
function lookWith(it, keepOuter=false){ const look = {...curLook(it.g)};

  if (it.cat==="dress"){ delete look.top; delete look.bottom; } if (it.cat==="top"||it.cat==="bottom") delete look.dress;

  if (it.cat==="top" && !look.bottom) { const b=ranked(it.g).find(x=>x.it.cat==="bottom"); if (b) look.bottom=b.it; }
  look[it.cat]=it; return look; }

function measureTable(it){

    return `<table class="mt"><tr><th>사이즈</th>${base.map(v=>`<th class="${v===p.shoe?"on":""}">${v}</th>`).join("")}</tr></table><p class="note" style="margin:6px 0 0">내 발 사이즈 ${p.shoe}mm 기준으로 표시했어요. 발볼이 넓다면 5mm 크게 고르세요.</p>`; }
  if (it.cat==="bag") return `<p class="small muted" style="margin:0">가방은 사이즈 구분이 없어요.</p>`;
  const rs = recSize(it,p), cur = S.fit[g].size[it.id]!=null ? S.fit[g].size[it.id] : rs.idx;
  const rows = [];
  if (["top","outer","dress"].includes(it.cat)) { rows.push(["어깨너비", i=>garment(it,i).shoulder, p.shoulder]); rows.push(["가슴단면", i=>garment(it,i).chest/2, p.chest/2]); }

}

  const icon = (c1, c2, fg) => `<svg viewBox="0 0 100 100"><defs><linearGradient id="ic${c1.slice(1)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="28" fill="url(#ic${c1.slice(1)})"/><path d="M37 31 L47 41 L65 20" fill="none" stroke="${fg}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 41 L47 46 L18 68 Q14 72 20 74 L80 74 Q86 72 82 68 L53 46" fill="none" stroke="${fg}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<section class="tab">
  <div class="head"><div><div class="eyebrow">Brand kit · v${APP_VERSION}</div><h2>OTJAL 브랜드</h2><p class="muted">OTJAL은 "옷 잘 입는 사람"에서 온 이름이에요. 옷걸이 고리를 체크 표시로 바꿔 "나에게 맞는 옷을 골랐다"는 뜻을 담았어요.</p></div></div>
  <div class="bgrid">
    <div class="panel fs"><div class="eyebrow">Primary logo</div>
      <div class="logoBig"><svg viewBox="0 0 100 100"><use href="#logoMark"/></svg><span class="wm"><b>OTJAL</b><span class="ver">v${APP_VERSION}</span></span></div>
      <p class="note" style="margin:0">로고 색은 성별 모드에 따라 바뀌어요(여성 로즈 · 남성 애저). 워드마크는 Cormorant Garamond, 본문은 Noto Sans KR을 써요.</p>
    </div>
    <div class="panel fs"><div class="eyebrow">App icon</div>
      <div class="icons"><div>${icon("#F49AB2","#DC4E76","#fff")}여성 기본</div><div>${icon("#8EA6F5","#3F60D2","#fff")}남성 기본</div><div>${icon("#FFFFFF","#F6ECE8","#DC4E76")}화이트</div><div>${icon("#3A3840","#1E1D22","#F2C8D3")}다크</div></div>
    </div>
  </div>
  <div class="panel fs"><div class="eyebrow">Main slogan</div><p class="slogan" style="margin:0">나에게 잘 맞는 옷,<br>OTJAL이 찾아준다.</p></div>
  <div class="panel fs"><div class="eyebrow">Campaign lines · 20–30s</div>
    <ul class="slist">
      <li><span>앱스토어</span><b>오늘 뭐 입지? 3초면 끝.</b></li>
      <li><span>SNS 광고</span><b>장바구니 앞 선택장애, OTJAL이 끝내줄게.</b></li>
      <li><span>3D 피팅</span><b>내 몸 그대로, 먼저 입어보고 사세요.</b></li>
      <li><span>감성 카피</span><b>고민은 OTJAL이, 설렘은 나에게.</b></li>
      <li><span>커뮤니티</span><b>오늘부터 나도 #옷잘러</b></li>
      <li><span>English</span><b>Pick less. Wear well.</b></li>
    </ul></div>
  <div class="panel fs"><div class="eyebrow">Color</div>
    <div class="pal">
      <div><i style="background:#E0577D"></i><p>Rose<br>#E0577D</p></div><div><i style="background:#4467D8"></i><p>Azure<br>#4467D8</p></div>
      <div><i style="background:#C9A27C"></i><p>Champagne<br>#C9A27C</p></div><div><i style="background:#FBF6F4"></i><p>Blush mist<br>#FBF6F4</p></div>
      <div><i style="background:#27262B"></i><p>Ink<br>#27262B</p></div>
    </div></div>
  <div class="panel small muted">Creator · <b style="color:var(--ink)">${CREATOR}</b> · OTJAL 서비스 기획·디자인·개발 · <a href="${REPO_URL}" target="_blank" rel="noopener">GitHub</a></div>
  </section>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button, a[data-go]"); if (!b) return;
  const d = b.dataset, g = S.g, p = P();
  if (d.go){ e.preventDefault(); go(d.go); return; }
  if (d.g){ S.g = d.g; save(); render(); return; }
  if (d.occ){ S.pick = {occ:d.occ, i:0}; save(); render(); return; }
  if (d.cocc){ S.coordOcc = d.cocc; save(); render(); return; }
  if (d.cat){ S.recCat = d.cat; save(); render(); return; }
  if (d.sort){ S.recSort = d.sort; save(); render(); return; }
  if (d.site){ S.sites = S.sites.includes(d.site) ? S.sites.filter(x=>x!==d.site) : [...S.sites, d.site]; save(); b.setAttribute("aria-pressed", S.sites.includes(d.site)); return; }
  if (d.one){ p[d.one] = d.v; save(); render(); return; }
  if (d.multi){ const a=p[d.multi]||[]; p[d.multi] = a.includes(d.v) ? a.filter(x=>x!==d.v) : [...a, d.v]; save(); b.setAttribute("aria-pressed", p[d.multi].includes(d.v)); if (S.tab==="style") refreshPreview(); return; }
  if (d.preset!=null){ const t=SZ[g], i=+d.preset; Object.assign(p,{shoulder:t.shoulder[i],chest:mid(t.chest[i]),waist:mid(t.waist[i]),hip:mid(t.hip[i])}); save(); render(); return; }
  if (d.rmcl!=null){ S.closet[g].splice(+d.rmcl,1); save(); render(); return; }
  if (b.id==="clAdd"){ (S.closet[g] ||= []).push({cat:$("#clCat").value, color:$("#clColor").value}); save(); render(); return; }
  if (b.id==="reset1"){ $("#resetBox").innerHTML = `<span class="small"><b>정말 지울까요?</b> 체형·취향·옷장·찜이 모두 기본값으로 돌아가요.</span><button class="btn sm pri" id="reset2">지우기</button><button class="btn sm" id="reset0">취소</button>`; return; }
  if (b.id==="reset2"){ try{ localStorage.removeItem("otjal-v1"); }catch(_){} S = defaults(); S.tab="style"; save(); render(); return; }
  if (b.id==="reset0"){ render(); return; }
  if (d.size){ S.fit[g].size[d.size] = +d.i; save(); render(); return; }
  if (d.close!==undefined){ $("#shopDlg").close(); return; }
  if (d.themeSet){ S.theme=d.themeSet; save(); renderTabs(); return; }
  if (d.dsize){ S.fit[g].size[d.dsize] = +d.i; save(); render(); openDetail(d.dsize); return; }
  if (d.more){ S.recOpen[d.more] = !S.recOpen[d.more]; save(); render(); return; }
  if (d.jump){ const el=$("#sec-"+d.jump); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const inDlg = !!b.closest("#shopDlg");
  switch (d.act){
    case "detail": openDetail(d.id); break;
    case "logo": { const dl=$("#shopDlg"); if (dl.open) dl.close(); S.tab="home"; S.pick.i=0; save(); render(); window.scrollTo({top:0}); break; }
    case "qr": openQR(); break;
    case "refer": openRefer(); break;
    case "copyRefer": copyText(referText(), $("#referNote")); break;
    case "share": { const t=referText(); try { if (window.OTJALApp && OTJALApp.share){ OTJALApp.share(t); break; } } catch(e){}
      if (navigator.share) navigator.share({title:"OTJAL", text:t}).catch(()=>copyText(t,$("#referNote"))); else copyText(t,$("#referNote")); break; }
    case "estimate": estimateBody(); save(); render(); break;
    case "budgetPreset": { const f=+d.v, base=g==="F"?{top:60000,bottom:60000,dress:80000,outer:160000,shoes:80000,bag:70000}:{top:60000,bottom:70000,dress:80000,outer:180000,shoes:100000,bag:90000};
      for (const k in base) p.budget[k]=Math.round(base[k]*f/5000)*5000; save(); render(); break; }
    case "wReset": p.w={style:30,closet:20,budget:15,fit:15,occ:10,color:10}; save(); render(); break;
    case "wear": { const it=BYID[d.id]; wear(it); save(); render(); if (inDlg) openDetail(d.id); break; }
    case "pvDress": S.previewDress = d.v==="1"; save(); render(); break;
    case "autoSize": S.fit[g].size = {}; save(); render(); break;
    case "sitesAll": S.sites = SITES.map(s=>s.id); save(); render(); break;
    case "sitesNone": S.sites = []; save(); render(); break;
    case "repick": S.pick.i++; save(); render(); const st=$("#stage"); if(st){ st.classList.remove("pop"); void st.offsetWidth; st.classList.add("pop"); } break;
    case "wish": S.wish = S.wish.includes(d.id) ? S.wish.filter(x=>x!==d.id) : [...S.wish, d.id]; save(); render(); if (inDlg) openDetail(d.id); break;
    case "like": for (const s of BYID[d.id].styles) S.likes[g+s]=(S.likes[g+s]||0)+1; save(); b.textContent="반영했어요"; b.disabled=true; break;
    case "hide": S.hides.push(d.id); save(); render(); break;
    case "unhide": S.hides = S.hides.filter(id=>BYID[id].g!==g); save(); render(); break;
    case "top3": S.top3 = !S.top3; save(); render(); break;
    case "q": S.q = $("#q").value; save(); $("#qOut").innerHTML = qBlock() || `<p class="note" style="margin:0">찾는 옷을 입력해 주세요.</p>`; break;
    case "shop": { const it=BYID[d.id]; openShop([{label:it.name, kw:kwFor(it)}], it.name); break; }
    case "try": { wear(BYID[d.id]); save(); if (inDlg) $("#shopDlg").close(); go("fit"); break; }
    case "shopLook": { const o=outfits(g,d.o,5)[+d.li]; if(o) openShop(o.items.map(it=>({label:`${CATNAME[it.cat]} · ${it.name}`, kw:kwFor(it)})), `${d.o}룩 한번에 찾기`); break; }
    case "tryLook": { const o=outfits(g,d.o,5)[+d.li]; if(o){ const f=S.fit[g]; for (const c of ["top","bottom","dress","outer","shoes","bag"]) f[c] = o.look[c] ? o.look[c].id : ""; save(); go("fit"); } break; }
    case "shopFit": { const l=Object.values(curLook()); if(l.length) openShop(l.map(it=>({label:`${CATNAME[it.cat]} · ${it.name}`, kw:kwFor(it)})), "피팅룸 착장 찾기"); break; }
    case "shopWish": { const l=S.wish.map(id=>BYID[id]).filter(it=>it.g===g); openShop(l.map(it=>({label:it.name, kw:kwFor(it)})), "찜 목록 찾기"); break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.slot!==undefined){ const f=S.fit[S.g], c=el.dataset.slot; f[c]=el.value;
    if (c==="dress" && el.value){ f.top=""; f.bottom=""; } if ((c==="top"||c==="bottom") && el.value) f.dress=""; save(); render(); }
});
document.addEventListener("keydown", e => { if (e.target.id==="q" && e.key==="Enter"){ e.preventDefault(); S.q=e.target.value; save(); $("#qOut").innerHTML = qBlock(); } });
$("#shopDlg").addEventListener("click", e => { if (e.target.id==="shopDlg") e.target.close(); });

const H = (location.hash||"").slice(1); if (TABS.some(t=>t[0]===H)) S.tab = H;
render();
</script>

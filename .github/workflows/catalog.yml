# OTJAL 실제 판매 상품 카탈로그 자동 갱신 — Rat Rae Choi
#  · 6시간마다: 쿠팡 파트너스 Open API(키가 있을 때) + 운영자 추천 목록(data/curated.csv)
#  · data/curated.csv 를 고치면 바로 다시 만들어 1~2분 안에 앱에 반영
name: catalog
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["data/curated.csv", "tools/build-catalog.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: catalog
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 실제 상품 모으기
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python tools/build-catalog.py
      - name: 카탈로그 반영
        run: |
          git config user.name "otjal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/catalog
          git diff --cached --quiet || (git commit -m "catalog: 실제 판매 상품 갱신 $(date -u +%F' '%H:%M)" && git pull --rebase && git push)
